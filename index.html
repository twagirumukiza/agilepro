<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgilePro — Agile, Scrum, Kanban & Lean Startup</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --btn-blue: #7dd3fc;
            --btn-blue-hover: #38bdf8;
            --btn-dark: rgba(255, 255, 255, 0.08);
            --btn-dark-hover: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 750px;
            padding: 40px;
            box-sizing: border-box;
        }

        /* Sélecteur de langue */
        .lang-selector {
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .lang-btn.active, .lang-btn:hover {
            background: var(--btn-dark-hover);
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--btn-blue);
            font-weight: 700;
            margin-bottom: 15px;
            display: block;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 3.8rem);
            line-height: 1.1;
            font-weight: 800;
            margin: 0 0 20px 0;
            letter-spacing: -1px;
        }

        /* Effet de dégradé */
        .grad {
            background: linear-gradient(135deg, #7dd3fc 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.description {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 35px;
            max-width: 600px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 45px;
        }

        .btn {
            padding: 14px 26px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: transform 0.15s ease, background-color 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, #7dd3fc 0%, #38bdf8 100%);
            color: #0b132b;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
        }

        .btn-secondary {
            background-color: var(--btn-dark);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-secondary:hover {
            background-color: var(--btn-dark-hover);
        }

        .footer-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Boutons de changement de langue -->
        <div class="lang-selector">
            <button id="frBtn" class="lang-btn active" onclick="setLang('fr')">FR</button>
            <button id="enBtn" class="lang-btn" onclick="setLang('en')">EN</button>
        </div>

        <!-- Badge -->
        <span class="badge" id="badgeText">Agile • Scrum • Kanban • Lean Startup</span>

        <!-- Titre principal -->
        <h1 id="mainTitle">The right <span class="grad">Agile tips</span> to move into action.</h1>

        <!-- Description -->
        <p class="description" id="mainDesc">
            Practical training, maturity assessments and coaching to help teams create more value, collaborate and adapt.
        </p>

        <!-- Boutons d'action -->
        <div class="button-group">
            <a href="#" class="btn btn-primary" id="btnTraining">View training</a>
            <a href="#" class="btn btn-secondary" id="btnAssess">Assess my maturity</a>
        </div>

        <!-- Pied de page -->
        <div class="footer-info" id="footerText">
            Consulting • Training • Assessment • Workshops • by Twagirumukiza
        </div>
    </div>

    <script>
        // Dictionnaire des traductions
        const translations = {
            fr: {
                badge: "Agile • Scrum • Kanban • Lean Startup",
                title: "Les bons <span class=\"grad\">conseils Agiles</span> pour passer à l'action.",
                desc: "Formations pratiques, évaluations de maturité et accompagnement pour aider les équipes à créer plus de valeur, collaborer et s'adapter.",
                btnTraining: "Voir les formations",
                btnAssess: "Évaluer ma maturité",
                footerText: "Conseil • Formation • Évaluation • Ateliers • par Twagirumukiza"
            },
            en: {
                badge: "Agile • Scrum • Kanban • Lean Startup",
                title: "The right <span class=\"grad\">Agile tips</span> to move into action.",
                desc: "Practical training, maturity assessments and coaching to help teams create more value, collaborate and adapt.",
                btnTraining: "View training",
                btnAssess: "Assess my maturity",
                footerText: "Consulting • Training • Assessment • Workshops • by Twagirumukiza"
            }
        };

        function setLang(lang) {
            // 1. Mettre à jour l'attribut lang du document HTML
            document.documentElement.lang = lang;

            // 2. Activer visuellement le bon bouton
            document.getElementById('frBtn').classList.toggle('active', lang === 'fr');
            document.getElementById('enBtn').classList.toggle('active', lang === 'en');

            // 3. Appliquer les traductions (innerHTML pour le titre afin de conserver la balise span.grad)
            document.getElementById('badgeText').textContent = translations[lang].badge;
            document.getElementById('mainTitle').innerHTML = translations[lang].title;
            document.getElementById('mainDesc').textContent = translations[lang].desc;
            document.getElementById('btnTraining').textContent = translations[lang].btnTraining;
            document.getElementById('btnAssess').textContent = translations[lang].btnAssess;
            document.getElementById('footerText').textContent = translations[lang].footerText;
        }
    </script>
</body>
</html>
